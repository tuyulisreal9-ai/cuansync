<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>CUANSYNC | Wallet Multi-Mata Uang</title>
    <meta
      name="description"
      content="CUANSYNC adalah wallet multi-mata uang untuk mengelola saldo, transaksi, anggaran, dan target keuangan dengan rapi."
    />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d0c" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CUANSYNC" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <!-- Favicon CUANSYNC -->
    <link rel="icon" type="image/webp" href="/icons/icon-48.webp" sizes="48x48" />
    <!-- DM Sans untuk teks, DM Mono khusus angka nominal -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const themeKey = "monefy-theme";
        const legacyThemeKey = "kas-poipet-theme";
        const themeRaw =
          window.localStorage.getItem(themeKey) ??
          window.localStorage.getItem(legacyThemeKey) ??
          '"system"';
        const savedTheme = JSON.parse(themeRaw);
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches;
        const resolvedTheme = savedTheme === "system" ? (prefersDark ? "dark" : "light") : savedTheme;
        if (!window.localStorage.getItem(themeKey) && window.localStorage.getItem(legacyThemeKey)) {
          window.localStorage.setItem(themeKey, themeRaw);
        }
        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
      } catch {}
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <!-- bg-mist dan text-ink kini menunjuk ke --cs-bg dan --cs-ink yang sudah
       berganti nilai sendiri di mode gelap, jadi override dark: tidak lagi
       diperlukan dan justru menimpa palet baru. -->
  <body class="min-h-full bg-mist text-ink transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="./src/bootstrap.js"></script>
  </body>
</html>
